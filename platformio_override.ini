; Build environment for the IoTorero AR01V3 (ESP32, IR + 433 MHz RF).
; Same as the official tasmota32-ir (all IR protocols incl. GREE IRHVAC),
; plus the RF library. RcSwitch itself is switched on by scripts/patch_tasmota.py,
; because FIRMWARE_IR undefines USE_RC_SWITCH after user_config_override.h.
; OTA_URL points to the latest *tested* release of this project (pre-releases are
; skipped by GitHub). The official URL would install an image without RF.

[platformio]
default_envs = tasmota32-ir-rf

[env:tasmota32-ir-rf]
extends                 = env:tasmota32_base
build_flags             = ${env:tasmota32_base.build_flags}
                          -DFIRMWARE_IR
                          -DCODE_IMAGE_STR='"ir-rf"'
                          -DOTA_URL='"https://github.com/de-sascha/tasmota-ir-rf-remote/releases/latest/download/tasmota32-ir-rf.bin"'
lib_extra_dirs          = lib/libesp32, lib/lib_basic, lib/lib_ssl, lib/lib_rf
lib_ignore              = ${env:tasmota32_base.lib_ignore}
                          Micro-RTSP
